<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Bus / Jeepney icon shape -->
  <g fill="#ffffff" transform="translate(64, 76)">
    <rect x="32" y="32" width="320" height="280" rx="36" fill="#f8fafc" />
    <!-- Front windshield -->
    <rect x="56" y="56" width="272" height="110" rx="16" fill="#0284c7" />
    <path d="M192 56 L192 166" stroke="#f8fafc" stroke-width="6"/>
    <!-- Headlights -->
    <circle cx="88" cy="240" r="22" fill="#fbbf24" />
    <circle cx="296" cy="240" r="22" fill="#fbbf24" />
    <!-- Grille -->
    <rect x="136" y="224" width="112" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="136" y="244" width="112" height="12" rx="6" fill="#cbd5e1"/>
    <!-- Wheels -->
    <rect x="56" y="312" width="64" height="24" rx="10" fill="#334155"/>
    <rect x="264" y="312" width="64" height="24" rx="10" fill="#334155"/>
    <!-- Philippine Sun Emblem Badge in center -->
    <circle cx="192" cy="190" r="16" fill="#eab308" />
  </g>
</svg>
